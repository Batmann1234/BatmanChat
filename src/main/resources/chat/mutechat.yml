#=================================================================================================#
#                    BatmanChat - chat/mutechat.yml (/mutechat)
#=================================================================================================#
#
#  /mutechat (alias /togglechat, /silenciarchat)   Permiso: batmanchat.mutechat   (o chatmanager.mutechat / chatsentry.togglechat)
#  Bypass (pueden hablar con el chat silenciado): batmanchat.mutechat.bypass  (o chatmanager.bypass.mutechat)
#  Variables: {player}
#
#=================================================================================================#

# Bloquear tambien ciertos comandos mientras el chat esta silenciado.
Disable_Commands: true
# Comandos bloqueados (solo si Disable_Commands es true).
Disabled_Commands:
  - "/message"
  - "/msg"
  - "/m"
  - "/tell"
  - "/t"
  - "/whisper"
  - "/w"
  - "/me"
  - "/reply"
  - "/r"
  - "/pm"

Mensajes:
  Denied_Message: '&fNo se pudo enviar el mensaje: el chat esta desactivado actualmente.'
  Enabled: '{Prefix} &fEl chat ha sido &aactivado&f por {player}&f.'
  Disabled: '{Prefix} &fEl chat ha sido &7desactivado&f por {player}&f.'
  Blocked_Command: '{Prefix} &cNo puedes usar ese comando mientras el chat esta silenciado.'

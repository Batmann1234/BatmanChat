#=================================================================================================#
#                    BatmanChat - chat/mutechat.yml (/mutechat)
#=================================================================================================#
#
#  /mutechat (alias /togglechat, /silenciarchat)   Permiso: batmanchat.mutechat   (o chatmanager.mutechat)
#  Bypass (pueden hablar con el chat silenciado): batmanchat.mutechat.bypass  (o chatmanager.bypass.mutechat)
#  Variables: {player}
#
#=================================================================================================#

# Bloquear tambien ciertos comandos mientras el chat esta silenciado.
Disable_Commands: false
# Comandos bloqueados (solo si Disable_Commands es true).
Disabled_Commands:
  - "/message"
  - "/msg"
  - "/m"
  - "/tell"
  - "/t"
  - "/whisper"
  - "/w"
  - "/me"
  - "/reply"
  - "/r"

Mensajes:
  Denied_Message: '{Prefix} &cNo puedes hablar en el chat en este momento.'
  Enabled: '{Prefix} &aEl chat ha sido activado por {player}.'
  Disabled: '{Prefix} &cEl chat ha sido silenciado por {player}.'
  Blocked_Command: '{Prefix} &cNo puedes usar ese comando mientras el chat esta silenciado.'

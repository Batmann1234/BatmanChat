#=================================================================================================#
#              BatmanChat - chat/items-interactivos.yml (reemplazo de InteractiveChat)
#=================================================================================================#
#
#  Valores copiados de tu config.yml de InteractiveChat:
#    !item / !i / !!objeto  -> mano        !inventario / !inv / !inventory   -> inv
#    !enderchest / !ender / !ec -> ender   !money / !m / !dinero             -> dinero
#    !internet / !ms / !ping -> ping
#  NUEVO: !pv <numero> (ej: !pv 3 o !pv3) -> pv: muestra uno de tus vaults de AxVaults en solo lectura.
#
#  ANTI-DUPE: lo que se muestra es una COPIA del momento en que escribiste el mensaje. El
#  inventario/ender/vault se abre en un menu de solo lectura y la copia caduca (Expiracion_Segundos).
#  Los items del menu y del hover son copias LIMPIAS: solo material, cantidad, nombre, lore,
#  encantamientos, atributos y datos visuales (flags, skull, shulker, color, trims, pociones). Sin NBT/PersistentData (MythicMobs, etc.) ni marcas nuevas.
#
#  Permisos (por defecto todos): batmanchat.items.mano, .inv, .ender, .dinero, .ping, .pv
#  Quitar el cooldown: batmanchat.items.cooldown.bypass
#  El dinero necesita Vault + un plugin de economia.
#
#  Variables: {item} (solo mano, opcional), {player}, {dinero}, {ping}
#  Colores: &a, &#RRGGBB, #RRGGBB (BatmanChat no lee <#RRGGBB>).
#
#=================================================================================================#

Enable: true

# Caracter que va delante de cada palabra.
Prefijo: "!"

# Maximo de tokens por mensaje (InteractiveChat: MaxPlaceholders -1 = sin limite).
Max_Por_Mensaje: 10

# Cooldown en segundos (InteractiveChat: 3 para todos). Para dar menos espera a un rango anade
# su grupo de LuckPerms, por ejemplo:   hero: 1
Cooldown:
  default: 3

# InteractiveChat: ItemDisplay.Settings.Timeout = 5 minutos.
Expiracion_Segundos: 300
Max_Fotos: 300

# Que datos "visuales" se conservan en las copias del menu (!inv, !ec, !pv) y en el hover (!i).
# Son solo cosmeticos: la copia sigue siendo de solo lectura y sin NBT extra.
Copiar:
  # Hide flags (HIDE_ENCHANTS, HIDE_ATTRIBUTES, HIDE_UNBREAKABLE, HIDE_ADDITIONAL_TOOLTIP...), hide tooltip,
  # estilo de tooltip, brillo forzado e irrompible. Si lo pones en false, todos los items se ven con tooltip completo.
  Tooltip: true
  # Textura de las cabezas de jugador (skull). Si lo pones en false, todas se ven como la cabeza por defecto.
  Skull: true
  # Contenido de las shulker boxes (cada item de dentro tambien se copia limpio, como cualquier otro).
  Contenido_Shulker: true
  # Color de las armaduras de cuero.
  Color_Cuero: true
  # Trims de armadura.
  Trims: true
  # Tipo, efectos y color de pociones y flechas con efecto.
  Pociones: true
  # NUNCA se copia el NBT / PersistentData / componentes custom (ej: items de MythicMobs): ni en el item
  # ni en los items de dentro de las shulkers. Solo se copian los datos visuales de arriba.

Tokens:
  mano:
    Alias: [item, i, objeto, mano, hand]
    # {item} es opcional: sin el, se ve este texto; con el cursor encima se ve el item y con clic se abre la vista.
    Formato: "&f[&aObjeto de {player}&f]"
    Titulo_Menu: "&fItem de {player}"
  inv:
    Alias: [inventario, inv, inventory]
    Formato: "&f[&aInventario de {player}&f]"
    Hover:
      - "&aClick para ver!"
    Titulo_Menu: "&aInventario de {player}"
  ender:
    Alias: [enderchest, ender, ec]
    Formato: "&f[&aEnderChest de {player}&f]"
    Hover:
      - "&aClick para ver!"
    Titulo_Menu: "&aInventario de {player}"
  pv:
    Alias: [pv, vault, baul]
    # Se escribe con numero: !pv 3  o  !pv3  (sin numero no se convierte).
    Acepta_Numero: true
    # Comando que abre TU vault numero {numero} en AxVaults. Cambialo si en tu servidor es otro (ej: "vault {numero}").
    # BatmanChat lo ejecuta como el jugador, copia el contenido en cuanto se abre y lo cierra al instante
    # (mientras tanto bloquea sus clics). El jugador necesita el permiso de AxVaults para ese vault.
    Comando: "pv {numero}"
    # Milisegundos maximos que espera a que AxVaults abra el vault.
    Espera_Maxima_Ms: 2500
    Formato: "&f[&aVault {numero} de {player}&f]"
    Hover:
      - "&aClick para ver!"
    Titulo_Menu: "&aVault {numero} de {player}"
  dinero:
    Alias: [money, m, dinero]
    Formato: "[Dinero de {player}]"
    Hover:
      - "&fDinero de {player}: &a{dinero}"
  ping:
    Alias: [internet, ms, ping]
    Formato: "Mi ping actual es &a{ping}&ams"
    Hover:
      - "&7Ping de {player}"

Mensajes:
  Cooldown: "&fDebes esperar&a {segundos}s &fantes de usar &aeso &fotra vez!"
  Mano_Vacia: "&fDebes tener algo en tu mano para usar este comando!"
  Sin_Economia: "{Prefix} &cEl dinero no esta disponible ahora mismo."
  Cierra_Inventario: "{Prefix} &cCierra el inventario que tienes abierto para mostrar tu vault."
  Vault_No_Disponible: "{Prefix} &cNo se pudo abrir tu vault {numero} (no existe o no tienes permiso)."
  Ocupado: "{Prefix} &cEspera, tu vault todavia se esta procesando."
  Cierra_Para_Ver: "{Prefix} &cCierra el inventario que tienes abierto para ver esto."
  Caducado: "&aLa sesion ha expirado"
  Solo_Jugadores: "{Prefix} &cSolo los jugadores pueden abrir esto."

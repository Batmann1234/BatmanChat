Mensajes:
  Uso: "{Prefix} &cUso: &e/batmanchat compra <jugador> <paquete> [precio] [id-transaccion]"
  Duplicada: "{Prefix} &eLa transaccion {transaccion} ya fue anunciada, se ignora."
  Anunciada: "{Prefix} &aCompra de &f{player} &aanunciada ({paquete})."

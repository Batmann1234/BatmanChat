#=================================================================================================#
#        BatmanChat - servidor/entradas-salidas.yml (primera entrada, entrada/salida y MOTD)
#=================================================================================================#
#
#  Misma estructura que la seccion Messages y MOTD del config.yml de ChatManager.
#
#  Variables: {player}, {server_name} y cualquier placeholder de PlaceholderAPI (%luckperms_prefix%...).
#  Colores: &a, HEX con #RRGGBB, degradados <gradient:#FF0000:#0000FF>texto</gradient>.
#
#  1. Primera entrada (First_Join): se muestra a los jugadores que entran por primera vez.
#     Cada seccion se activa o desactiva por separado.
#  2. Mensajes de entrada y salida (Join_Quit_Messages): Join_Message, Quit_Message, Actionbar_Message
#     y Title_Message. Se activan o desactivan por separado con Enable.
#  3. Permiso_Silencioso: los jugadores con ese permiso entran y salen sin mensaje.
#  4. Ocultar_Mensajes_Vanish: si el jugador esta en vanish no se muestran sus mensajes de entrada/salida.
#
#=================================================================================================#

# Nombre del servidor para la variable {server_name}.
Server_Name: "Valterion"

# Permiso para entrar y salir SIN mensaje (ni el de entrada, ni el de salida, ni el de primera entrada).
# El jugador sigue recibiendo su MOTD, actionbar y titulo. Dalo por LuckPerms:
#   /lp group staff permission set batmanchat.join.silent true
# Deja "" para desactivarlo.
Permiso_Silencioso: "batmanchat.join.silent"

# Ocultar los mensajes de entrada/salida de los jugadores en vanish (Essentials, SuperVanish, PremiumVanish).
Ocultar_Mensajes_Vanish: true

Messages:
  # Si el mensaje de entrada por defecto debe quitarse y enviarse un tick despues como broadcast.
  # Util si algunos placeholders no estan cargados justo al entrar (por ejemplo el plugin TAB).
  Async: false

  First_Join:
    Welcome_Message:
      Enable: false
      # Sonido que se envia a todos en el servidor. toggle: false para desactivarlo.
      sound:
        toggle: false
        value: 'ENTITY_PLAYER_LEVELUP'
        pitch: 1.0
        volume: 1.0
      First_Join_Message: "#03FF00&lVALTERION &8&l| &7Denle la bienvenida a #03FF00{player} #03FF00[&f%server_unique_joins%#03FF00]"

    Actionbar_Message:
      Enable: false
      First_Join_Message: "&eBienvenido a &b{server_name} %luckperms_prefix% {player}&e!"

    Title_Message:
      Enable: false
      # Ticks que tarda el titulo en aparecer.
      Fade_In: 40
      # Ticks que el titulo se queda en pantalla.
      Stay: 20
      # Ticks que tarda en desaparecer.
      Fade_Out: 40
      First_Join_Message:
        Header: "&eBienvenido"
        Footer: "&b{player} a {server_name}"

  Join_Quit_Messages:
    Join_Message:
      Enable: true
      sound:
        toggle: false
        value: 'ENTITY_PLAYER_LEVELUP'
        pitch: 1.0
        volume: 1.0
      Message: "&8[#00FF3F+&8]&f {player}"

    Quit_Message:
      Enable: true
      sound:
        toggle: false
        value: 'ENTITY_PLAYER_LEVELUP'
        pitch: 1.0
        volume: 1.0
      Message: "&8[#FF4848-&8]&f {player}"

    Actionbar_Message:
      Enable: false
      Message: "&eBienvenido de vuelta a &b{server_name} %luckperms_prefix% {player}&e!"

    Title_Message:
      Enable: false
      # Fade_In, Stay y Fade_Out del titulo.
      Fade_In: 40
      Stay: 20
      Fade_Out: 40
      Message:
        Header: "&eBienvenido de vuelta"
        Footer: "&b{player} a {server_name}"

#=================================================================================================#
# MOTD: mensaje de bienvenida al entrar.
#=================================================================================================#
MOTD:
  Enable: false
  # Segundos de espera antes de mostrarlo despues de entrar.
  Delay: 2
  Message:
    - "&7&m------------------------------------"
    - "#03FF00Bienvenido al servidor &b{player}#03FF00!"
    - ""
    - "#03FF00Si necesitas ayuda escribe a cualquier miembro del staff conectado."
    - ""
    - "#03FF00Puedes cambiar este mensaje en servidor/entradas-salidas.yml"
    - "&7&m------------------------------------"
